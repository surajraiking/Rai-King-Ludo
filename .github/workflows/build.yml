name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Env and Local Properties
        run: |
          echo "GEMINI_API_KEY=dummy_key_for_build" > .env
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper 8.11.1
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Compile Debug APK (Skip Unit Tests & Lint)
        run: ./gradlew assembleDebug -x test -x testDebugUnitTest -x lint --no-daemon --stacktrace

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Rai-Ludo-King-APK
          path: app/build/outputs/apk/debug/*.apk

